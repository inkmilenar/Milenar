<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Milenar — Arte, Processo & Lifestyle</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #f7f5f0;
      color: #111;
      font-family: Arial, Helvetica, sans-serif;
    }

    .pagina {
      width: 90%;
      max-width: 900px;
      margin: auto;
    }

    header {
      min-height: 70vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .logo {
      font-size: clamp(65px, 15vw, 150px);
      font-weight: 900;
      letter-spacing: -7px;
      line-height: .8;
    }

    .subtitulo {
      margin-top: 28px;
      font-size: 11px;
      letter-spacing: 5px;
      text-transform: uppercase;
    }

    .linha {
      width: 40px;
      height: 1px;
      background: #111;
      margin: 40px auto;
    }

    .links {
      padding-bottom: 100px;
    }

    .links a {
      display: flex;
      justify-content: space-between;
      align-items: center;

      text-decoration: none;
      color: #111;

      border-top: 1px solid #bbb;
      padding: 22px 5px;

      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .links a:last-child {
      border-bottom: 1px solid #bbb;
    }

    .links a:hover {
      padding-left: 15px;
      padding-right: 15px;
      transition: .25s;
    }

    footer {
      text-align: center;
      padding: 50px 0;
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
  </style>
</head>

<body>

  <main class="pagina">

    <header>
      <div>
        <div class="logo">MILENAR</div>

        <p class="subtitulo">
          Arte · Processo · Lifestyle
        </p>

        <div class="linha"></div>
      </div>
    </header>

    <section class="links">

      <a href="#">
        <span>Instagram</span>
        <span>↗</span>
      </a>

      <a href="#">
        <span>WhatsApp</span>
        <span>↗</span>
      </a>

      <a href="#">
        <span>YouTube</span>
        <span>↗</span>
      </a>

      <a href="#">
        <span>Pinterest</span>
        <span>↗</span>
      </a>

      <a href="#">
        <span>Portfólio</span>
        <span>↗</span>
      </a>

    </section>

  </main>

  <footer>
    @milenar.ink · Belo Horizonte
  </footer>

</body>
</html>
